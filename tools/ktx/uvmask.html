<!doctype html><meta charset="utf-8"><title>Máscara UV (ktx_convert --uvpad)</title><script type="importmap">{"imports":{"three":"../../vendor/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../../vendor/GLTFLoader.js';
import { DRACOLoader } from '../../vendor/DRACOLoader.js';
const R={};
try{
const file=new URLSearchParams(location.search).get('f'); const S=+(new URLSearchParams(location.search).get('s')||1024);
const d=new DRACOLoader(); d.setDecoderPath('../../vendor/draco/'); const L=new GLTFLoader(); L.setDRACOLoader(d);
const g=await L.loadAsync('../../'+file.replace(/^\.?\//,''));
const cv=document.createElement('canvas'); cv.width=cv.height=S; const c=cv.getContext('2d'); c.fillStyle='#000'; c.fillRect(0,0,S,S); c.fillStyle='#fff';
let tris=0;
g.scene.traverse(o=>{ if(!o.isMesh) return; const uv=o.geometry.attributes.uv; if(!uv) return; const idx=o.geometry.index;
  const n=idx?idx.count:uv.count; for(let i=0;i<n;i+=3){ c.beginPath(); for(let k=0;k<3;k++){ const v=idx?idx.getX(i+k):i+k; const x=uv.getX(v)*S, y=uv.getY(v)*S; k?c.lineTo(x,y):c.moveTo(x,y);} c.closePath(); c.fill(); tris++; } });
let mn=[9,9],mx=[-9,-9]; g.scene.traverse(o=>{const uv=o.isMesh&&o.geometry.attributes.uv; if(!uv)return; for(let i=0;i<uv.count;i++){mn[0]=Math.min(mn[0],uv.getX(i));mn[1]=Math.min(mn[1],uv.getY(i));mx[0]=Math.max(mx[0],uv.getX(i));mx[1]=Math.max(mx[1],uv.getY(i));}}); R.tris=[tris,mn.map(v=>v.toFixed(3)),mx.map(v=>v.toFixed(3))].join(' '); R.png=cv.toDataURL('image/png');
}catch(e){R.err=e.stack;}
window.__r=R;
// Uso: tools/ktx/uvmask.html?f=assets/models/kappa.glb[&s=2048] → descarga <modelo>_uvmask.png (blanco = islas UV)
if (R.png) { const a=document.createElement('a'); a.href=R.png; a.download=(file.split('/').pop().replace(/\.glb$/,''))+'_uvmask.png'; a.textContent='Descargar máscara ('+R.tris+')'; document.body.appendChild(a); a.click(); }
else document.body.textContent=R.err||'';
</script>
